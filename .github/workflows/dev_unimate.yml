# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.NET Core app to Azure Web App - unimate

on:
    push:
        branches:
            - dev
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read # Required for actions/checkout

        steps:
            - uses: actions/checkout@v4

            - name: Set up .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x" # Specify .NET 8.0.x for compatibility

            - name: Install EF Core CLI
              run: dotnet tool install --global dotnet-ef --version 8.0.8 # Match your EF Core version

            - name: Restore dependencies
              run: dotnet restore unimate2.sln # Correct solution file name

            - name: Build with dotnet
              run: dotnet build unimate2.sln --configuration Release --no-restore

            - name: Run tests
              run: dotnet test Unimate2.Tests/Unimate2.Tests.csproj --no-build --verbosity normal

            - name: Update database
              env:
                  CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
              run: dotnet ef database update --project Unimate2/Unimate2.csproj
              working-directory: Unimate2 # Correct working directory

            - name: Publish Unimate2
              run: dotnet publish Unimate2/Unimate2.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v4
              with:
                  name: .net-app
                  path: ${{env.DOTNET_ROOT}}/myapp

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: "Production"
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        permissions:
            contents: read # Required for actions/checkout

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v4
              with:
                  name: .net-app

            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: "unimate" # Your Azure App Service name
                  slot-name: "Production"
                  package: .
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }} # Use publish profile secret

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - unimate2

on:
    push:
        branches:
            - dev
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        permissions:
            contents: read #This is required for actions/checkout

        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Node.js dependencies
              run: npm --version

            - name: Set up .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.x"

            - name: Build with dotnet
              run: dotnet build Unimate2/Unimate2.csproj --configuration Release

            - name: Run tests
              run: dotnet test Unimate2.Tests/Unimate2.Tests.csproj

            - name: dotnet publish
              run: dotnet publish Unimate2/Unimate2.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v4
              with:
                  name: .net-app
                  path: ${{env.DOTNET_ROOT}}/myapp

    deploy:
        runs-on: windows-latest
        needs: build
        environment:
            name: "Production"
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        permissions:
            id-token: write #This is required for requesting the JWT
            contents: read #This is required for actions/checkout

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v4
              with:
                  name: .net-app

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_55279E5F0F7441D3AB81CA1DCBC2082B }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3F67362B856F499E9476664464F7B10C }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0FCA9E98EFDA4E82B532E2A40CDA5D69 }}

            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: "unimate2"
                  slot-name: "Production"
                  package: .
